[versions]
firebaseCrashlyticsGradle = "3.0.7"
googleServices = "4.5.0"
gradle = "9.3.1"
junit = "4.13.2"
kotlin = "2.4.10"
coroutine = "1.11.0"
ksp = "2.3.11"
lifecycle = "2.11.0"
appcompat = "1.8.0"
preference = "1.2.1"
recyclerview = "1.4.0"
constraintlayout = "2.2.2"
material = "1.14.0"
retrofit = "3.0.0"
firebase_bom = "34.17.0"
jacoco = "0.8.15"
dagger = "2.60.1"
navigation = "2.10.1"

[plugins]
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

google-services = { module = "com.google.gms:google-services", version.ref = "googleServices" }

junit = { module = "junit:junit", version.ref = "junit" }

lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

firebase_bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase_bom" }
firebase-ads = { module = "com.google.firebase:firebase-ads", version = "23.6.0" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-crashlytics-gradle = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsGradle" }

appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
navigation-gradle = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "navigation" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

material = { module = "com.google.android.material:material", version.ref = "material" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutine" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutine" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutine" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-android = { module = "com.google.dagger:dagger-android", version.ref = "dagger" }
dagger-android-support = { module = "com.google.dagger:dagger-android-support", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
dagger-android-processor = { module = "com.google.dagger:dagger-android-processor", version.ref = "dagger" }

jsoup = { module = "org.jsoup:jsoup", version = "1.23.1" }

smoothprogressbar = { module = "com.github.castorflex.smoothprogressbar:library", version = "1.1.0" }

gson = { module = "com.google.code.gson:gson", version = "2.14.0" }

assertj = { module = "org.assertj:assertj-core", version = "3.27.7" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
mockito = { module = "org.mockito:mockito-core", version = "5.23.0" }
